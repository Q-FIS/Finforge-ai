name: Bug Report
description: File a bug report to help improve FinForge AI
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem in FinForge AI. Please fill in the details below.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior. Include minimal runnable code if applicable.
      placeholder: |
        1. Install '...'
        2. Run code '...'
        3. See error '...'
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment Information
      description: Operating System, Python version, FinForge AI version, relevant dependencies.
      placeholder: |
        - OS: [e.g. Ubuntu 22.04 / macOS 14 / Windows 11]
        - Python version: [e.g. 3.11.8]
        - FinForge AI version: [e.g. 0.1.0.dev0]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Log Output or Traceback
      description: Please copy and paste any relevant terminal output or traceback.
      render: shell
