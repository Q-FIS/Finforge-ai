[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tfidf-vectorizer"
version = "0.1.0"
description = "Scratch IDF and TF-IDF weighting component for FinForge AI (RET-07)."
readme = "README.md"
requires-python = ">=3.11"
authors = []
dependencies = [
    "finforge-ai>=0.1.0.dev0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "scikit-learn>=1.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tfidf_vectorizer"]
