[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "text-cleaner"
version = "0.1.0"
description = "A scratch-first text-cleaner component for FinForge AI."
readme = "README.md"
requires-python = ">=3.11"
authors = []
dependencies = [
    "finforge-ai>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/text_cleaner"]
