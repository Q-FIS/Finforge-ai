[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "portfolio-loader"
version = "0.1.0"
description = "Loads asset risk metrics and volumes"
readme = "README.md"
requires-python = ">=3.11"
authors = []
dependencies = [
    "finforge-ai>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/portfolio_loader"]
